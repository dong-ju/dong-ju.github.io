<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14223e"><title>지원금 레이더 — 게임 & AI 개발툴</title>
<style>
:root{color-scheme:light;--navy:#14223e;--ink:#1c2b45;--muted:#748299;--line:#e4e9f2;--green:#08795e;--bg:#f6f8fb;--blue:#315cce}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#2d5bcb;text-decoration:none}a:hover{text-decoration:underline}
.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:216px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;background:#14243f;padding:25px 14px;display:flex;flex-direction:column;gap:26px;color:#e4eafa}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#3261b0;font-size:22px;color:#fff}.brand b{font-size:17px}.brand small{display:block;color:#a9bada;font-size:10px}
.navlist{display:grid;gap:5px}.nav{border:0;background:transparent;color:#d4def0;border-radius:10px;padding:12px;text-align:left;font-weight:700}.nav.active,.nav:hover{background:#2b4063;color:#fff}.sidefoot{margin-top:auto;border-top:1px solid #394962;padding:15px 9px 0;font-size:12px;color:#a2b5d4}
main{padding:27px clamp(16px,3.7vw,54px) 70px;width:100%;max-width:1440px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:#4a6db1}.top h1{font-size:27px;letter-spacing:-.8px;margin:3px 0}.topright{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border:1px solid #d8e0ec;border-radius:10px;background:#fff;font-size:13px;font-weight:700;color:#263a5a}.btn:hover{background:#edf2fa}.btn.primary{background:#2a5fd4;border-color:#2a5fd4;color:#fff}.btn.primary:hover{background:#234ba7}.btn.small{padding:7px 9px;font-size:12px}
.tag{display:inline-flex;align-items:center;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap;background:#eaf0ff;color:#3861b4}.tag.green{background:#e7f7ef;color:#08795e}.tag.orange{background:#fff1da;color:#9d670f}.tag.red{background:#feebe6;color:#aa4c38}.tag.grey{background:#eef1f6;color:#687993}
.hero{background:linear-gradient(110deg,#1f3965,#14243e);border-radius:18px;padding:23px 26px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.hero h2{font-size:21px;letter-spacing:-.5px;margin:4px 0 6px}.hero p{margin:0;font-size:13px;color:#c9d5e9;max-width:650px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;line-height:1.4;margin:8px 0 2px;letter-spacing:-1px}.stat .foot{font-size:11px;color:#8b98ab}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 12px}.sectionhead h2{font-size:18px;letter-spacing:-.4px;margin:0}.sectionhead p{color:var(--muted);font-size:12px;margin:2px 0}
.notice{background:#ebf2fe;color:#315687;border:1px solid #d8e7ff;border-radius:11px;padding:12px 15px;font-size:12px;margin:15px 0 20px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s}.gcard:hover{border-color:#9eb7e1;box-shadow:0 9px 35px #152b5418}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px}
.cardname{font-size:16px;font-weight:800;letter-spacing:-.3px}.agency{font-size:12px;color:#8795a8;margin:3px 0 12px}
.award{font-size:17px;font-weight:850;letter-spacing:-.4px}.period{border-top:1px solid #e9edf3;margin-top:13px;padding-top:12px;font-size:12px;color:#73839c}
.progresslabel{display:flex;align-items:center;justify-content:space-between;margin:13px 0 7px;font-size:12px;color:#69778e}.bar{height:7px;background:#edf1f6;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#25a583;border-radius:9px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}.filters{display:flex;flex-wrap:wrap;gap:6px}
.filter{padding:7px 11px;border:1px solid #dce4ed;border-radius:9px;background:#fff;font-size:12px;font-weight:700;color:#697b94}.filter.active{background:#2b436b;color:#fff;border-color:#2b436b}
.searchbox{display:flex;background:#fff;border:1px solid #dce3ee;border-radius:10px;align-items:center;padding:0 12px;gap:7px;width:min(380px,100%)}.searchbox input{background:transparent;border:0;padding:10px 0;width:100%;outline:0}
.empty{border:1px dashed #d6dfec;border-radius:13px;padding:35px;text-align:center;color:#71839a;background:#fff}.empty p{font-size:12px}
.calendar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.month{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;min-height:130px}.month h3{margin:0 0 12px;font-size:14px}.month-item{font-size:11px;line-height:1.35;background:#f0f4fb;border-left:3px solid #6395ea;margin:6px 0;padding:7px 6px;border-radius:3px 7px 7px 3px;cursor:pointer}.month-item.game{border-color:#2ca582}
.event{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;margin:9px 0}.eventicon{flex:none;border-radius:50%;background:#edf2fc;width:32px;height:32px;display:grid;place-items:center;color:#3864ad}.event p{margin:2px 0;font-size:12px;color:#75839a;overflow-wrap:anywhere}
.modal-back{position:fixed;inset:0;background:#14243f80;z-index:30;display:flex;justify-content:flex-end}.panel{background:white;width:min(620px,100%);height:100%;overflow-y:auto;padding:23px 25px 70px;box-shadow:-14px 0 45px #14243f22}.panelhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.panelhead h2{margin:4px 0;font-size:21px;line-height:1.4}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:span 2}.field label{color:#748198;font-size:11px;font-weight:800}.field input,.field textarea,.field select{width:100%;min-width:0;border:1px solid #d9e1ec;border-radius:9px;padding:9px;background:#fff;color:#1c2b45;outline:0}.field textarea{resize:vertical;min-height:72px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#5a91e9}
.task{display:flex;align-items:center;gap:9px;border:1px solid #e7ecf3;border-radius:9px;padding:9px;margin:6px 0;font-size:13px}.task input{accent-color:#0e9273;width:17px;height:17px}.task label{flex:1}.task.done label{text-decoration:line-through;color:#98a6b8}.task button{background:none;border:0;color:#a3acba}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.section{margin-top:22px}.smalltext{font-size:12px;color:var(--muted)}
.login{position:fixed;inset:0;background:#f2f5fa;z-index:60;display:flex;align-items:center;justify-content:center;padding:22px}
.login-card{background:white;border:1px solid #dde6f0;border-radius:21px;padding:30px;width:min(410px,100%);box-shadow:0 18px 45px #14243f14}.login-card h1{font-size:23px;margin:9px 0}.login-card p{font-size:13px;color:var(--muted);margin:0 0 18px}.login-card input{display:block;border:1px solid #d5deeb;border-radius:9px;width:100%;text-align:center;letter-spacing:6px;padding:11px;font-size:23px;margin:12px 0}.login-card .btn{width:100%}.authmsg{min-height:23px;font-size:12px;color:#3870bd;margin-top:13px}
@media(max-width:1060px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.calendar{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.shell{display:block}.side{height:auto;z-index:12;padding:9px 13px;gap:9px}.brand{padding:0}.logo{height:32px;width:32px;font-size:18px}.brand small,.sidefoot{display:none}.navlist{display:flex;overflow-x:auto;gap:4px}.nav{white-space:nowrap;padding:9px;font-size:12px}main{padding:21px 13px 80px}.top h1{font-size:21px}.hero{display:block;padding:19px}.hero h2{font-size:18px}.hero .btn{margin-top:12px}.cards{grid-template-columns:1fr}.stat{padding:13px}.stat strong{font-size:24px}.calendar{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:18px 14px 70px}.desktop{display:none}}
</style></head><body>
<div class="login" id="login"><div class="login-card"><div style="font-size:34px;color:#3566bb">✳</div><h1>지원금 레이더</h1><p>한판 게임과 AI 빌드툴의 지원사업을 관리합니다. 텔레그램으로 로그인 인증번호를 받으세요.</p><button class="btn primary" id="send-code">텔레그램으로 인증번호 받기</button><div id="code-section" class="hidden"><input id="auth-code" inputmode="numeric" maxlength="6" placeholder="6자리"><label class="row" style="margin:10px 0 14px;font-size:13px;color:#455875"><input type="checkbox" id="remember-device" checked style="width:17px;height:17px;margin:0;letter-spacing:0;accent-color:#2a5fd4"> 이 기기에서 로그인 유지 (30일, 사용 시 연장)</label><button class="btn primary" id="verify-code">로그인하기</button></div><div id="auth-msg" class="authmsg"></div><div class="smalltext">@sharys_support_search_bot</div></div></div>
<div class="shell hidden" id="app"><aside class="side"><div class="brand"><div class="logo">✳</div><div><b>지원금 레이더</b><small>GAME & AI SOFTWARE</small></div></div><nav class="navlist" id="nav"><button class="nav active" data-view="home">◈ 대시보드</button><button class="nav" data-view="grants">▤ 지원사업</button><button class="nav" data-view="calendar">▦ 일정</button><button class="nav" data-view="history">◉ 변경 이력</button><button class="nav" data-view="discover">⌕ 검색</button></nav><div class="sidefoot">매일 오전 9시 공고 확인<br>달라진 내용만 텔레그램 알림</div></aside>
<main><header class="top"><div><div class="eyebrow">2027 GRANTS WORKSPACE</div><h1 id="title">지원사업 대시보드</h1></div><div class="topright"><span class="tag green desktop">● API 연결</span><button class="btn small desktop" id="refresh">⟳ 갱신</button><button class="btn small" id="logout">로그아웃</button></div></header><div id="content"></div></main></div>
<div class="modal-back hidden" id="modal-back"><div class="panel" id="modal"></div></div>
<script>
(function(){
"use strict";
var base="https://dnvphihaopivjcvkvvud.supabase.co/functions/v1/grants-dashboard",sessionToken=localStorage.getItem("grants_dash_token")||sessionStorage.getItem("grants_dash_token")||"",store={grants:[],tasks:[],changes:[],today:"",officialApiReady:false},view="home",project="all",pay="all",search="",selected=null,requestId=null;
var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v===undefined||v===null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var prep={planned:"준비 전",working:"준비 중",ready:"제출 준비 완료",applied:"신청 완료",review:"심사 중",selected:"선정",rejected:"미선정"};
var payText={zero:"자부담 0원",low:"소액 부담",high:"자부담 있음",unknown:"확인 필요"};
var statusText={expected:"접수 예상",open:"접수 중",closed:"마감",suspended:"보류"};
var projText={game:"게임",builder:"AI 빌드툴",both:"공통"};
async function api(path,init){var h={"content-type":"application/json"};if(sessionToken)h.Authorization="Bearer "+sessionToken;var res=await fetch(base+path,{...init,credentials:"omit",headers:{...h,...(init&&init.headers||{})}});var data={};try{data=await res.json()}catch(e){}if(!res.ok){if(res.status===401 && !path.includes("/auth/")){sessionToken="";localStorage.removeItem("grants_dash_token");sessionStorage.removeItem("grants_dash_token");showLogin();}throw new Error(data.error||"요청 실패 ("+res.status+")")}return data}
function showLogin(){$("#login").classList.remove("hidden");$("#app").classList.add("hidden")}
function showApp(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden")}
function tasks(g){return store.tasks.filter(function(t){return t.grant_id===g.id})}
function progress(g){var ts=tasks(g);return ts.length?Math.round(100*ts.filter(function(t){return t.completed}).length/ts.length):0}
function period(g){return g.actual_start||g.actual_deadline?"확정 입력: "+(g.actual_start||"시작 미정")+" ~ "+(g.actual_deadline||"마감 미정"):"2027 예상: "+(g.expected_start_month||"?")+"~"+(g.expected_end_month||"?")+"월"}
function badge(g){var k=g.self_pay_level;return '<span class="tag '+(k==="zero"?"green":k==="low"?"orange":k==="high"?"red":"grey")+'">'+esc(payText[k]||"확인 필요")+'</span>'}
function card(g){var p=progress(g);return '<article class="gcard" data-open="'+esc(g.id)+'"><div class="cardtop"><span class="tag">'+esc(projText[g.project]||"공통")+'</span>'+badge(g)+'</div><div class="cardname">'+esc(g.name)+'</div><div class="agency">'+esc(g.agency)+'</div><div class="award">'+esc(g.award||"금액 확인 필요")+'</div><div class="period">'+esc(period(g))+'<div>'+esc(statusText[g.public_status])+' · 전년도 공고 기준 참고</div></div><div class="progresslabel"><span>'+esc(prep[g.preparation_status])+'</span><b>'+p+'%</b></div><div class="bar"><div style="width:'+p+'%"></div></div></article>'}
function sorted(){return store.grants.filter(function(g){if(project!=="all" && g.project!==project && g.project!=="both")return false;if(pay!=="all"&&g.self_pay_level!==pay)return false;var q=search.toLowerCase().trim();return !q||(g.name+" "+g.agency+" "+g.summary).toLowerCase().includes(q)}).sort(function(a,b){return a.priority-b.priority})}
function stat(label,value,foot){return '<div class="stat"><small>'+label+'</small><strong>'+value+'</strong><span class="foot">'+foot+'</span></div>'}
function stats(){var done=store.tasks.filter(function(t){return t.completed}).length;return '<div class="stats">'+stat("관리 지원사업",store.grants.length,"게임·AI 개발툴") +stat("자부담 0원 후보",store.grants.filter(function(g){return g.self_pay_level==="zero"}).length,"전년도 조건 기준") +stat("접수 중",store.grants.filter(function(g){return g.public_status==="open"}).length,"확인된 실제 상태") +stat("준비 진행률",store.tasks.length?Math.round(done/store.tasks.length*100)+"%":"0%",done+" / "+store.tasks.length+"개 완료")+'</div>'}
function historyCard(x){return '<div class="event"><div class="eventicon">'+(x.kind==="task"?"✓":"↗")+'</div><div><b>'+esc(x.title)+'</b><p>'+esc(x.detail)+'</p><span class="smalltext">'+esc(new Date(x.created_at).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"}))+'</span></div></div>'}
function home(){var gs=store.grants.slice().sort(function(a,b){return a.priority-b.priority});return '<section class="hero"><div><div class="eyebrow" style="color:#a4c6ff">GRANT MANAGEMENT</div><h2>게임과 AI 빌드툴, 준비부터 선정까지</h2><p>자부담 0원 후보를 먼저 추적하고 공고 변화·마감일·준비 상태를 한 곳에서 관리합니다.</p></div><button class="btn" data-navto="grants">전체 지원사업 보기 ↗</button></section>'+stats()+'<div class="notice"><b>2027년 접수 일정은 예상입니다.</b> 전년도 공고를 바탕으로 준비한 자료이며 실제 모집·지원액·자부담은 새 공고로 재확인해야 합니다.</div><div class="sectionhead"><div><h2>우선 준비할 지원사업</h2><p>자부담이 적은 공고를 우선으로 정렬합니다.</p></div><button class="btn small" data-navto="grants">전체 보기</button></div><div class="cards">'+gs.slice(0,4).map(card).join("")+'</div><div class="sectionhead"><h2>최근 변경 내용</h2><button class="btn small" data-navto="history">기록 보기</button></div>'+(store.changes.length?store.changes.slice(0,4).map(historyCard).join(""):'<div class="empty">아직 기록된 변경이 없습니다. 준비 항목을 수정하면 이곳에 표시됩니다.</div>')}
function grants(){var tabs=[["all","전체"],["game","게임"],["builder","AI 빌드툴"]];var pays=[["all","부담 전체"],["zero","0원"],["low","소액"],["unknown","미확인"],["high","자부담"]];return '<div class="toolbar"><div class="filters">'+tabs.map(function(x){return '<button class="filter '+(project===x[0]?"active":"")+'" data-project="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div><button class="btn primary" data-new="1">+ 지원사업 등록</button></div><div class="toolbar"><div class="searchbox">⌕ <input id="search" placeholder="사업명·기관·내용 검색" value="'+esc(search)+'"></div><div class="filters">'+pays.map(function(x){return '<button class="filter '+(pay===x[0]?"active":"")+'" data-pay="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div></div><div class="sectionhead"><div><h2>지원사업 '+sorted().length+'개</h2><p>카드를 누르면 준비 상태와 마감일을 수정할 수 있습니다.</p></div></div><div class="cards" id="grant-list">'+sorted().map(card).join("")+'</div>'}
function calendar(){var result='';for(var m=1;m<=12;m++){var gs=store.grants.filter(function(g){return g.expected_start_month&&g.expected_end_month&&m>=g.expected_start_month&&m<=g.expected_end_month});result+='<div class="month"><h3>'+m+'월</h3>'+gs.map(function(g){return '<div class="month-item '+(g.project==="game"?"game":"")+'" data-open="'+g.id+'">'+esc(g.name.split("·")[0])+'</div>'}).join("")+(gs.length?'':'<span class="smalltext">예상 일정 없음</span>')+'</div>'}return '<div class="notice">이 달력은 <b>2027년 예상 모집시기</b>를 보여줍니다. 실제 접수일과 마감일은 해당 사업 카드에서 따로 관리합니다.</div><div class="sectionhead"><h2>2027 예상 모집 달력</h2></div><div class="calendar">'+result+'</div>'}
function history(){return '<div class="sectionhead"><div><h2>변경 이력</h2><p>신규 등록·준비 상태 변경·일정 수정 기록</p></div></div>'+(store.changes.length?store.changes.map(historyCard).join(""):'<div class="empty">기록된 변경이 없습니다.</div>')}
function discover(){return '<div class="notice"><b>공식 신규 공고 검색</b>은 기업마당 API 인증키가 필요합니다. 키가 없어도 등록된 사업을 검색·수정할 수 있으며, ChatGPT 자동화의 검증된 공고 등록은 별도 동작합니다.</div><div class="sectionhead"><div><h2>신규 지원 공고 검색</h2><p>공식 API 검색 결과는 신청자격과 자부담 검증 전 후보입니다.</p></div></div><form id="discover-form" class="row"><div class="searchbox" style="flex:1;max-width:none">⌕ <input id="discover-query" value="게임" placeholder="게임, AI, 소프트웨어, 개발 등"></div><button class="btn primary">공고 검색</button></form><div id="discover-result" style="margin-top:18px">'+(store.officialApiReady?'<div class="empty">검색어를 입력하고 검색하세요.</div>':'<div class="empty">기업마당 공식 API 키가 아직 설정되지 않았습니다.<p>공식 제공기관의 API 키를 연결하면 자동 검색 기능을 활성화할 수 있습니다.</p><a href="https://www.bizinfo.go.kr" target="_blank" rel="noopener noreferrer">기업마당 공식 홈페이지 열기 ↗</a></div>')+'</div>'}
function render(){document.querySelectorAll("[data-view]").forEach(function(x){x.classList.toggle("active",x.dataset.view===view)});var names={home:"지원사업 대시보드",grants:"지원사업 관리",calendar:"2027 예상 일정",history:"변경 이력",discover:"지원사업 검색"};$("#title").textContent=names[view]||names.home;$("#content").innerHTML=({home:home,grants:grants,calendar:calendar,history:history,discover:discover}[view])()}
async function reload(){try{store=await api("/api/dashboard");showApp();render();if(selected)detail(selected)}catch(e){if(e.message!=="login_required")console.error(e)}}
function close(){selected=null;$("#modal-back").classList.add("hidden")}
function input(name,label,value,type,full){return '<div class="field '+(full?"full":"")+'"><label>'+esc(label)+'</label><input name="'+name+'" type="'+(type||"text")+'" value="'+esc(value||"")+'"></div>'}
function area(name,label,value){return '<div class="field full"><label>'+esc(label)+'</label><textarea name="'+name+'">'+esc(value||"")+'</textarea></div>'}
function select(name,label,value,choices){return '<div class="field"><label>'+esc(label)+'</label><select name="'+name+'">'+choices.map(function(c){return '<option value="'+esc(c[0])+'" '+(String(value)===String(c[0])?"selected":"")+'>'+esc(c[1])+'</option>'}).join("")+'</select></div>'}
function detail(id){selected=id;var g=id==="new"?null:store.grants.find(function(x){return x.id===id});if(id!=="new"&&!g)return;var d=g||{name:"",agency:"",project:"game",award:"",self_pay_level:"unknown",self_pay:"",public_status:"expected",preparation_status:"planned",expected_start_month:"",expected_end_month:"",actual_start:"",actual_deadline:"",official_url:"",summary:"",eligibility:"",constraints:"",notes:""};
var months=[["","미정"]].concat(Array.from({length:12},function(_,i){return [i+1,i+1+"월"]}));
var form='<form id="edit-form" class="formgrid">'+input("name","사업명",d.name,"text",true)+input("agency","주관기관",d.agency,"text",true)+select("project","관련 사업",d.project,[["game","게임"],["builder","AI 빌드툴"],["both","공통"]])+select("self_pay_level","자부담 분류",d.self_pay_level,[["zero","0원"],["low","소액"],["unknown","확인 필요"],["high","자부담"]])+input("award","지원 금액",d.award,"text",true)+input("self_pay","자부담·부가비용 상세",d.self_pay,"text",true)+select("public_status","공고 상태",d.public_status,[["expected","접수 예상"],["open","접수 중"],["closed","마감"],["suspended","보류"]])+select("preparation_status","내 준비 상태",d.preparation_status,Object.keys(prep).map(function(k){return [k,prep[k]]}))+select("expected_start_month","예상 시작 월",d.expected_start_month||"",months)+select("expected_end_month","예상 종료 월",d.expected_end_month||"",months)+input("actual_start","실제 접수 시작일",d.actual_start||"","date")+input("actual_deadline","실제 마감일",d.actual_deadline||"","date")+input("official_url","공식 공고 링크",d.official_url,"url",true)+area("summary","사업 개요",d.summary)+area("eligibility","신청 자격",d.eligibility)+area("constraints","조건·유의사항",d.constraints)+area("notes","나의 메모",d.notes)+'<div class="field full"><button class="btn primary" type="submit">변경 사항 저장</button></div></form>';
var ts=g?tasks(g):[];var checklist=g?'<div class="section"><div class="sectionhead"><div><h2>준비 체크리스트 '+progress(g)+'%</h2><p>완료한 항목은 진행률에 반영됩니다.</p></div></div>'+ts.map(function(t){return '<div class="task '+(t.completed?"done":"")+'"><input type="checkbox" data-task="'+esc(t.id)+'" '+(t.completed?"checked":"")+'><label>'+esc(t.title)+(t.due_date?' <span class="smalltext">· '+esc(t.due_date)+'</span>':'')+'</label><button type="button" class="btn small" data-edit-date="'+esc(t.id)+'" style="padding:4px 8px" title="목표일 수정">일정</button><button type="button" data-remove="'+esc(t.id)+'" aria-label="삭제">×</button></div>'}).join("")+'<form id="task-form" class="row" style="margin-top:13px"><input id="task-title" placeholder="새 준비 항목" required style="min-width:130px;flex:1;border:1px solid #dce3ee;border-radius:9px;padding:9px"><input id="task-due" type="date" title="준비 완료 목표일" style="border:1px solid #dce3ee;border-radius:9px;padding:9px"><button class="btn">추가</button></form></div>':"";
$("#modal").innerHTML='<div class="panelhead"><div><div class="eyebrow">'+(g?esc(projText[g.project]):"NEW")+'</div><h2>'+esc(g?g.name:"지원사업 신규 등록")+'</h2><span class="smalltext">'+esc(g?g.agency:"공고 원문을 확인하고 입력하세요.")+'</span></div><button class="btn small" data-close="1">✕ 닫기</button></div><div class="notice">2027년 공고 발표 전에는 과거 지원액과 일정을 실제 모집 조건으로 간주하지 마세요.</div>'+form+checklist+(g&&g.official_url?'<p><a target="_blank" rel="noopener noreferrer" href="'+esc(g.official_url)+'">공식 공고 확인 ↗</a></p>':"")+'<p id="edit-error" class="smalltext"></p>';$("#modal-back").classList.remove("hidden");
}
document.addEventListener("click",async function(ev){var t=ev.target;var x=t.closest("[data-view]");if(x){view=x.dataset.view;render();return}x=t.closest("[data-navto]");if(x){view=x.dataset.navto;render();return}x=t.closest("[data-open]");if(x){detail(x.dataset.open);return}x=t.closest("[data-project]");if(x){project=x.dataset.project;render();return}x=t.closest("[data-pay]");if(x){pay=x.dataset.pay;render();return}x=t.closest("[data-new]");if(x){detail("new");return}x=t.closest("[data-close]");if(x){close();return}x=t.closest("[data-edit-date]");if(x){var item=store.tasks.find(function(z){return z.id===x.dataset.editDate});if(!item)return;var due=prompt("준비 목표일을 입력하세요 (YYYY-MM-DD, 비우면 삭제)",item.due_date||"");if(due===null)return;due=due.trim();if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)){alert("YYYY-MM-DD 형식으로 입력하세요.");return}try{await api("/api/tasks/"+item.id,{method:"PATCH",body:JSON.stringify({due_date:due||null})});await reload()}catch(e){alert(e.message)}return}x=t.closest("[data-remove]");if(x){if(!confirm("이 준비 항목을 삭제할까요?"))return;try{await api("/api/tasks/"+x.dataset.remove,{method:"DELETE"});await reload()}catch(e){alert(e.message)}return}});
$("#modal-back").onclick=function(e){if(e.target===$("#modal-back"))close()};
document.addEventListener("input",function(ev){if(ev.target.id==="search"){search=ev.target.value;var container=$("#grant-list");if(container)container.innerHTML=sorted().map(card).join("");var heading=$("#content .sectionhead h2");if(heading)heading.textContent="지원사업 "+sorted().length+"개"}});
document.addEventListener("change",async function(ev){if(!ev.target.matches("[data-task]"))return;var id=ev.target.dataset.task;try{await api("/api/tasks/"+id,{method:"PATCH",body:JSON.stringify({completed:ev.target.checked})});await reload()}catch(e){alert(e.message)}});
document.addEventListener("submit",async function(ev){if(ev.target.id==="edit-form"){ev.preventDefault();var vals=Object.fromEntries(new FormData(ev.target).entries());["expected_start_month","expected_end_month"].forEach(function(k){vals[k]=vals[k]?Number(vals[k]):null});["actual_start","actual_deadline"].forEach(function(k){if(!vals[k])vals[k]=null});var target=selected==="new"?"/api/grants":"/api/grants/"+selected;var method=selected==="new"?"POST":"PATCH";try{var r=await api(target,{method:method,body:JSON.stringify(vals)});if(selected==="new"){selected=r.item.id}await reload()}catch(e){$("#edit-error").textContent="저장 실패: "+e.message}return}
if(ev.target.id==="task-form"){ev.preventDefault();var title=$("#task-title").value.trim(),due=$("#task-due").value;try{await api("/api/tasks",{method:"POST",body:JSON.stringify({grant_id:selected,title:title,due_date:due||null})});await reload()}catch(e){alert(e.message)}return}
if(ev.target.id==="discover-form"){ev.preventDefault();var query=$("#discover-query").value.trim();var result=$("#discover-result");result.innerHTML='<div class="empty">공식 API 조회 중…</div>';try{var r=await api("/api/discover?q="+encodeURIComponent(query));if(!r.configured){result.innerHTML='<div class="empty">기업마당 API 키가 설정되지 않았습니다. 먼저 인증키를 등록해야 합니다.</div>';return}result.innerHTML=r.candidates.length?r.candidates.map(function(x){return '<div class="event"><div><b>'+esc(x.title)+'</b><p>'+esc(x.period)+" · "+esc(x.agency)+'</p><p>'+esc(x.summary)+'</p><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">공식 공고 ↗</a></div></div>'}).join(""):'<div class="empty">조회된 후보가 없습니다.</div>'}catch(e){result.innerHTML='<div class="empty">공식 검색 실패: '+esc(e.message)+'</div>'}return}});
$("#send-code").onclick=async function(){this.disabled=true;$("#auth-msg").textContent="인증번호를 텔레그램으로 보내는 중…";try{var r=await api("/api/auth/request",{method:"POST",body:"{}"});requestId=r.request_id;$("#code-section").classList.remove("hidden");$("#auth-msg").textContent="봇에서 받은 6자리 번호를 입력하세요. (5분 유효)"}catch(e){$("#auth-msg").textContent="인증 요청 실패: "+e.message}finally{this.disabled=false}};
$("#verify-code").onclick=async function(){this.disabled=true;try{var session=await api("/api/auth/verify",{method:"POST",body:JSON.stringify({request_id:requestId,code:$("#auth-code").value.trim(),remember_device:$("#remember-device").checked})});if(!session.session_token)throw Error("인증 세션 발급 실패");sessionToken=session.session_token;localStorage.removeItem("grants_dash_token");sessionStorage.removeItem("grants_dash_token");if(session.remember_device)localStorage.setItem("grants_dash_token",sessionToken);else sessionStorage.setItem("grants_dash_token",sessionToken);$("#auth-msg").textContent="";await reload()}catch(e){$("#auth-msg").textContent="로그인 실패: "+e.message}finally{this.disabled=false}};
$("#auth-code").onkeydown=function(e){if(e.key==="Enter")$("#verify-code").click()};
$("#refresh").onclick=reload;
$("#logout").onclick=async function(){try{await api("/api/auth/logout",{method:"POST",body:"{}"})}catch(e){}sessionToken="";localStorage.removeItem("grants_dash_token");sessionStorage.removeItem("grants_dash_token");showLogin();$("#code-section").classList.add("hidden")};
(async function(){try{var r=await api("/api/me");if(r.authenticated)await reload();else showLogin()}catch(e){showLogin()}})();
})();
