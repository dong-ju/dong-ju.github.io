<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#235b49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="개인용 습관과 게임시간 보상 앱">
<link rel="manifest" href="/kid-habits/manifest.webmanifest">
<link rel="icon" href="/kid-habits/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/kid-habits/icon-192.png">
<title>우리 아이 게임시간</title>
<style>
:root{--ink:#182c27;--sub:#68766e;--green:#235b49;--lime:#eaf4e9;--sand:#f5f5f0;--white:#fff;--line:#e7ebe6;--gold:#f5db9b;--goldInk:#79531f;--danger:#a9443b;--dangerBg:#fcefeb;--orange:#92601d;--orangeBg:#fff2d7;--r:20px;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);font-synthesis:none}
*{box-sizing:border-box}
html{background:var(--sand)}
body{margin:0;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
h1,h2,h3,p{margin:0}
a{color:inherit}
.shell{max-width:1050px;padding:28px 26px 64px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:40px}
.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:800;letter-spacing:-.65px}
.mark{width:39px;height:39px;background:var(--green);color:var(--gold);display:grid;place-items:center;border-radius:12px;font-size:22px}
.header-right{display:flex;align-items:center;gap:9px}
.chip{background:#e7ede5;border:1px solid #dce6db;border-radius:99px;padding:7px 12px;color:#3f5d4d;font-size:12px;font-weight:750;white-space:nowrap}
.refresh{background:white;border:1px solid var(--line);border-radius:12px;width:36px;height:36px;color:var(--sub);font-size:18px}
.eyebrow{text-transform:uppercase;color:var(--green);font-size:12px;letter-spacing:1px;font-weight:800;margin-bottom:10px}
.page-title{font-size:clamp(26px,4vw,37px);line-height:1.3;font-weight:800;letter-spacing:-1.5px}
.sub{font-size:14px;line-height:1.6;color:var(--sub);margin-top:10px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 16px}
.section-head h2{font-size:19px;letter-spacing:-.7px}
.muted{color:var(--sub);font-size:12px}
.dashboard{display:grid;grid-template-columns:1.02fr .98fr;gap:22px;align-items:start}
.box{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.balance{position:relative;background:var(--green);border:1px solid #235b49;border-radius:25px;padding:29px;color:white;overflow:hidden;min-height:236px}
.balance:after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(255,255,255,.13);border-radius:50%;right:-90px;top:-60px;box-shadow:0 0 0 55px rgba(255,255,255,.025)}
.balance-label{position:relative;z-index:1;font-size:14px;color:#d8e8df;font-weight:600}
.balance-number{font-size:clamp(45px,7vw,65px);line-height:1.13;font-weight:850;letter-spacing:-2.2px;margin:23px 0 15px}
.balance-number small{font-size:20px;letter-spacing:-.6px;font-weight:650;margin-left:5px}
.balance-bottom{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#dbebe1}
.balance-bottom strong{color:white;font-size:14px}
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 18px}
.metric span{display:block;color:var(--sub);font-size:12px}
.metric strong{display:block;margin-top:10px;font-size:26px;letter-spacing:-1px}
.metric strong em{font-size:14px;font-style:normal;font-weight:500;color:var(--sub)}
.progress{height:9px;border-radius:10px;background:#e6e9e1;overflow:hidden;margin:20px 0 10px}
.progress > i{display:block;height:100%;background:#3b8467;border-radius:10px;transition:width .2s}
.tips{background:#fff7e5;border:1px solid #f2e5ca;border-radius:15px;padding:16px 18px;color:#735b31;font-size:13px;line-height:1.7}
.habit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.habit:first-child{padding-top:2px}
.habit:last-child{border:0;padding-bottom:0}
.habit-info{min-width:0;flex:1}
.habit-title{font-size:15px;font-weight:750;line-height:1.5;letter-spacing:-.35px;word-break:keep-all}
.habit-desc{margin-top:6px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--sub)}
.habit-award{color:var(--green);font-weight:750}
.status{display:inline-block;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:750;background:#eff2f0;color:#748077}
.status.pending{background:var(--orangeBg);color:var(--orange)}
.status.approved{background:var(--lime);color:var(--green)}
.status.rejected{background:var(--dangerBg);color:var(--danger)}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid transparent;border-radius:11px;padding:10px 15px;min-height:40px;font-size:13px;font-weight:750;white-space:nowrap;transition:background .2s}
.btn.primary{background:var(--green);color:white}
.btn.primary:hover{background:#164936}
.btn.secondary{background:#eff3ee;color:#305d48}
.btn.neutral{background:white;border-color:#dfe5de;color:#58665f}
.btn.warn{background:var(--dangerBg);color:var(--danger)}
.btn.wide{width:100%;padding:14px}
.btn.small{font-size:12px;padding:8px 10px;min-height:34px}
.tabs{display:flex;gap:6px;margin-top:29px;border-bottom:1px solid #dfe6de;overflow:auto}
.tab{border:0;background:none;color:#7b8780;font-size:14px;font-weight:750;padding:13px 17px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{border-color:var(--green);color:var(--green)}
.datebar{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-top:20px}
.datebar button{border:0;background:#f3f5f1;border-radius:9px;width:34px;height:34px;font-size:19px;color:var(--green)}
.datebar button:disabled{opacity:.3}
.datebar strong{font-size:14px}
.datebar small{font-size:12px;color:var(--sub);font-weight:500}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.logs{display:flex;flex-direction:column}
.log{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:15px 0;gap:18px}
.log:last-child{border:0}
.log strong{font-size:13px;font-weight:750}
.log p{color:var(--sub);font-size:12px;margin-top:6px}
.log .pos{font-size:15px;font-weight:850;color:var(--green);white-space:nowrap}
.log .neg{font-size:15px;font-weight:850;color:var(--danger);white-space:nowrap}
.empty{padding:40px 15px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}
.settings-row:last-child{border:0}
.settings-row strong{font-size:14px}
.settings-row p{font-size:12px;color:var(--sub);margin-top:5px}
.faded{opacity:.5}
footer{padding-top:38px;color:#88938b;font-size:11px;text-align:center}
.onboarding{min-height:calc(100dvh - 150px);display:flex;justify-content:center;align-items:center;padding:30px 0}
.welcome{max-width:515px;width:100%}
.welcome h1{font-size:clamp(30px,5vw,42px);letter-spacing:-1.6px;line-height:1.3}
.welcome .sub{margin-bottom:35px}
.role-card{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:23px;display:flex;text-align:left;align-items:center;gap:18px;margin-bottom:12px}
.role-card:hover{border-color:#6ca78b}
.role-icon{display:grid;place-items:center;background:#e6f1e5;border-radius:16px;min-width:55px;height:55px;font-size:25px}
.role-card strong{font-size:17px}
.role-card span{display:block;margin-top:5px;color:var(--sub);font-size:13px}
.role-arrow{margin-left:auto;font-size:20px;color:var(--green)}
.field{display:block;font-size:13px;font-weight:700;margin-bottom:9px}
.input{width:100%;background:#fff;border:1px solid #dce5dc;border-radius:12px;padding:14px 15px;min-height:48px;font-size:16px;outline:0;color:var(--ink)}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px #d6e9d7}
.fieldbox{margin-bottom:19px}
.infoline{font-size:12px;line-height:1.6;color:var(--sub)}
dialog{border:1px solid var(--line);border-radius:23px;box-shadow:0 20px 80px #0c241a32;max-width:min(94vw,500px);width:100%;padding:0;color:var(--ink)}
dialog::backdrop{background:#11272088}
.modal-content{padding:26px}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.modal-top h2{font-size:20px;letter-spacing:-.7px}
.x{border:0;background:#eef2ee;border-radius:9px;width:34px;height:34px;font-size:20px;color:var(--sub)}
.modal-actions{display:flex;gap:9px;margin-top:25px}
.modal-actions>*{flex:1}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:10;max-width:90vw;background:#1e3026;color:white;border-radius:12px;padding:13px 20px;box-shadow:0 10px 30px #182c2740;font-size:13px;text-align:center}
.offline{background:#fff2d7;color:#91621f;padding:12px 18px;text-align:center;border-bottom:1px solid #efd8a8;font-size:12px}
@media(max-width:720px){
 .shell{padding:20px 17px calc(55px + env(safe-area-inset-bottom))}
 .header{margin-bottom:31px}
 .dashboard{grid-template-columns:1fr;gap:23px}
 .box{padding:20px 18px}
 .balance{padding:25px;min-height:218px}
 .balance-number{font-size:53px}
 .habit{align-items:flex-start;gap:9px}
 .actions{min-width:88px;max-width:135px}
 .actions .btn{width:100%;padding:9px 9px}
 .metric strong{font-size:22px}
 .page-title{font-size:29px}
 .section-head{margin-top:29px}
 .section-head h2{font-size:18px}
 .welcome .sub{margin-bottom:25px}
 .onboarding{align-items:flex-start;padding:35px 0}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="modal"><div id="modalInner" class="modal-content"></div></dialog>
<div id="toast" class="toast" hidden role="status"></div>
<script>
(function(){
"use strict";
var STORE="kid_habits_personal_v1", MODE="kid_habits_personal_role_v1", SETUP="kid_habits_personal_setup_v1";
var app=document.getElementById("app"), modal=document.getElementById("modal");
var state=null, tab="today", date=null, offline=false, busy=false, deferred=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function textTime(n){n=Number(n)||0;if(n<0)return "-"+textTime(-n);return n>=60?(Math.floor(n/60)+"시간 "+(n%60)+"분"):n+"분";}
function dayLabel(s){return new Intl.DateTimeFormat("ko-KR",{month:"long",day:"numeric",weekday:"long",timeZone:"Asia/Seoul"}).format(new Date(s+"T12:00:00+09:00"));}
function dateShift(s,offset){var x=new Date(s+"T12:00:00+09:00");x.setUTCDate(x.getUTCDate()+offset);return x.toISOString().slice(0,10);}
function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.hidden=true;},3100);}

function todaySeoul(){
 var parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 var f={};parts.forEach(function(p){f[p.type]=p.value;});
 return f.year+"-"+f.month+"-"+f.day;
}
function newData(){
 return {version:1,habits:[
  {id:"morning",title:"아침에 일어나서 할 일 하기",reward_minutes:5,sort_order:1,active:true},
  {id:"study",title:"하루 공부 먼저 하기",reward_minutes:10,sort_order:2,active:true},
  {id:"sleep",title:"멋지게 잠들기",reward_minutes:5,sort_order:3,active:true},
  {id:"posture",title:"하루 종일 바른 자세 하기",reward_minutes:10,sort_order:4,active:true}
 ],checks:[],ledger:[]};
}
function validData(d){
 return d&&d.version===1&&Array.isArray(d.habits)&&Array.isArray(d.checks)&&Array.isArray(d.ledger)&&
 d.habits.length<=1000&&d.checks.length<=30000&&d.ledger.length<=60000&&
 d.habits.every(function(h){return h&&typeof h.id==="string"&&typeof h.title==="string"&&
 Number.isInteger(h.reward_minutes)&&h.reward_minutes>=1&&h.reward_minutes<=180&&typeof h.active==="boolean";})&&
 d.checks.every(function(c){return c&&typeof c.id==="string"&&typeof c.habit_id==="string"&&typeof c.day==="string"&&
 ["pending","approved","rejected"].includes(c.status)&&Number.isInteger(c.awarded_minutes)&&c.awarded_minutes>=0;})&&
 d.ledger.every(function(l){return l&&typeof l.id==="string"&&typeof l.kind==="string"&&Number.isInteger(l.minutes)&&typeof l.description==="string";});
}
function readData(){
 var raw=localStorage.getItem(STORE);
 if(!raw){var fresh=newData();localStorage.setItem(STORE,JSON.stringify(fresh));return fresh;}
 var d;try{d=JSON.parse(raw);}catch(e){throw new Error("저장된 자료가 손상됐습니다. 백업 파일을 확인해주세요.");}
 if(!validData(d))throw new Error("저장된 개인용 자료를 읽을 수 없습니다.");
 return d;
}
function writeData(d){localStorage.setItem(STORE,JSON.stringify(d));}
function currentRole(){return localStorage.getItem(MODE)==="child"?"child":"parent";}
function id(){return typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():"h-"+Date.now()+"-"+Math.random().toString(36).slice(2);}
function tally(ledger){
 var total={balance:0,earned:0,penalties:0,spent:0,reversals:0};
 ledger.forEach(function(l){
  total.balance+=l.minutes;
  if(l.kind==="habit"||l.kind==="bonus")total.earned+=l.minutes;
  else if(l.kind==="penalty")total.penalties-=l.minutes;
  else if(l.kind==="spend")total.spent-=l.minutes;
  else if(l.kind==="reversal")total.reversals-=l.minutes;
 });
 return total;
}
function record(d,kind,minutes,description,day,checkId){
 d.ledger.unshift({id:id(),kind:kind,minutes:minutes,description:description,day:day||todaySeoul(),
  created_at:new Date().toISOString(),check_id:checkId||null,actor_id:"personal-parent"});
}
function requireParent(){if(currentRole()!=="parent")throw new Error("부모 화면에서 처리해주세요.");}
function activeHabit(d,habitId){
 var h=d.habits.find(function(x){return x.id===habitId&&x.active;});
 if(!h)throw new Error("사용할 수 없는 습관입니다.");
 return h;
}
async function api(route,payload,method){
 var d=readData(),role=currentRole(),today=todaySeoul(),now=new Date().toISOString();
 if(route.indexOf("state")===0){
  var supplied=route.indexOf("?day=")>=0?decodeURIComponent(route.split("?day=")[1]):today;
  var day=role==="child"?today:(/^\d{4}-\d{2}-\d{2}$/.test(supplied)&&supplied<=today?supplied:today);
  return {device:{id:"personal-"+role,role:role,label:"개인용 "+(role==="parent"?"부모":"아이")},
    today:today,day:day,habits:d.habits.filter(function(h){return role==="parent"||h.active;})
      .sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);}),
    checks:d.checks.filter(function(c){return c.day===day;}),summary:tally(d.ledger),
    ledger:d.ledger.slice(0,role==="parent"?90:25),devices:[]};
 }
 payload=payload||{};
 if(route==="submit"){
  if(role!=="child")throw new Error("아이 화면에서 완료 요청을 해주세요.");
  activeHabit(d,payload.habitId);
  var check=d.checks.find(function(c){return c.habit_id===payload.habitId&&c.day===today;});
  if(!check){d.checks.push({id:id(),habit_id:payload.habitId,day:today,status:"pending",awarded_minutes:0,submitted_at:now,reviewed_at:null,reviewed_by:null});}
  else if(check.status==="rejected"){check.status="pending";check.submitted_at=now;check.reviewed_at=null;check.reviewed_by=null;}
  writeData(d);return {ok:true};
 }
 if(route==="review"){
  requireParent();
  if(!["approved","rejected"].includes(payload.status))throw new Error("확인 결과를 선택해주세요.");
  var h=activeHabit(d,payload.habitId),day=payload.day;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(day||"")||day>today)throw new Error("날짜를 확인해주세요.");
  var check=d.checks.find(function(c){return c.habit_id===payload.habitId&&c.day===day;});
  if(!check)throw new Error("아이가 먼저 완료를 요청해야 합니다.");
  if(check.status==="rejected"&&payload.status==="approved")throw new Error("아이가 다시 제출한 후 승인할 수 있습니다.");
  if(check.status!==payload.status){
   if(check.status==="approved")record(d,"reversal",-check.awarded_minutes,h.title,day,check.id);
   if(payload.status==="approved"){check.awarded_minutes=h.reward_minutes;record(d,"habit",h.reward_minutes,h.title,day,check.id);}
   else check.awarded_minutes=0;
   check.status=payload.status;check.reviewed_at=now;check.reviewed_by="personal-parent";
  }
  writeData(d);return {ok:true};
 }
 if(route==="habit"){
  requireParent();
  var t=payload.title===undefined?null:String(payload.title).trim(),minutes=payload.minutes===undefined?null:Number(payload.minutes);
  if(t!==null&&(t.length<1||t.length>80))throw new Error("습관 이름은 1~80자입니다.");
  if(minutes!==null&&(!Number.isInteger(minutes)||minutes<1||minutes>180))throw new Error("보상 시간은 1~180분입니다.");
  if((method||"POST")==="POST"){
   if(t===null||minutes===null)throw new Error("습관 이름과 보상 시간을 입력해주세요.");
   d.habits.push({id:id(),title:t,reward_minutes:minutes,
     sort_order:d.habits.reduce(function(n,h){return Math.max(n,h.sort_order||0);},0)+1,active:true});
  }else{
   var h=d.habits.find(function(x){return x.id===payload.id;});
   if(!h)throw new Error("습관을 찾지 못했습니다.");
   if(t!==null)h.title=t;if(minutes!==null)h.reward_minutes=minutes;
   if("active" in payload){if(typeof payload.active!=="boolean")throw new Error("상태가 올바르지 않습니다.");h.active=payload.active;}
  }
  writeData(d);return {ok:true};
 }
 if(route==="adjust"){
  requireParent();
  var minutes=Number(payload.minutes),kind=payload.kind,desc=String(payload.description||"").trim();
  if(!["bonus","penalty","spend"].includes(kind)||!Number.isInteger(minutes)||minutes<1||minutes>300||desc.length<1||desc.length>100)
   throw new Error("시간과 사유를 확인해주세요.");
  if(kind!=="bonus"&&minutes>tally(d.ledger).balance)throw new Error("사용 가능한 게임시간보다 큽니다.");
  record(d,kind,kind==="bonus"?minutes:-minutes,desc,today,null);
  writeData(d);return {ok:true};
 }
 throw new Error("지원하지 않는 작업입니다.");
}
function head(role){
 return '<header class="header"><div class="brand"><span class="mark">✓</span><span>우리 아이 게임시간</span></div><div class="header-right">'+
 (role?'<button class="btn neutral small" data-action="switchrole">'+(role==="parent"?"아이 화면":"부모 화면")+' 전환</button>':'')+
 (role?'<button class="refresh" aria-label="새로고침" data-action="reload">↻</button>':'')+'</div></header>';
}
function shell(content,role){app.innerHTML='<div class="shell">'+head(role)+content+'<footer>개인용 모드 · 기록은 이 브라우저에 저장됩니다 · 부모 화면의 습관 관리에서 백업 가능</footer></div>';}
function chipFor(st){var label={pending:"부모 확인 대기",approved:"완료 승인",rejected:"다시 확인",none:"아직 확인 전"};return '<span class="status '+esc(st||"none")+'">'+label[st||"none"]+'</span>';}
function iconFor(st){return st==="approved"?"✓":st==="pending"?"◷":st==="rejected"?"!":"○";}
function listHabits(parent){
 var checks={};(state.checks||[]).forEach(function(x){checks[x.habit_id]=x;});
 var list=state.habits.filter(function(h){return h.active;});
 if(!list.length)return '<div class="empty">등록된 습관이 없습니다.</div>';
 return '<div class="box">'+list.map(function(h){
  var check=checks[h.id],st=check?check.status:"none";
  var buttons="";
  if(parent){
   if(st==="approved")buttons='<button class="btn neutral small" data-action="review" data-status="rejected" data-id="'+esc(h.id)+'">승인 취소</button>';
   else if(st==="pending")buttons='<button class="btn primary small" data-action="review" data-status="approved" data-id="'+esc(h.id)+'">승인하기</button>'+
     '<button class="btn warn small" data-action="review" data-status="rejected" data-id="'+esc(h.id)+'">반려</button>';
   else buttons='<button class="btn neutral small" disabled>'+(st==="rejected"?"재제출 기다림":"아이 제출 대기")+'</button>';
  }else{
   buttons=st==="approved"?'<button class="btn secondary small" disabled>보상 적립됨 ✓</button>':st==="pending"?'<button class="btn neutral small" disabled>확인 기다리는 중</button>':'<button class="btn primary small" data-action="submit" data-id="'+esc(h.id)+'">'+(st==="rejected"?"다시 했어요":"했어요!")+'</button>';
  }
  return '<div class="habit"><div class="habit-info"><div class="habit-title">'+(parent?'':'<span style="color:#87aa93;margin-right:7px">'+iconFor(st)+'</span>')+esc(h.title)+'</div><div class="habit-desc"><span class="habit-award">+'+h.reward_minutes+'분</span>'+chipFor(st)+'</div></div><div class="actions">'+buttons+'</div></div>';
 }).join("")+'</div>';
}
function balanceCard(){
 var b=state.summary;
 return '<div class="balance"><div class="balance-label">지금 사용 가능한 게임시간</div><div class="balance-number">'+(Math.max(0,b.balance)<60?Math.max(0,b.balance):Math.floor(Math.max(0,b.balance)/60))+'<small>'+(Math.max(0,b.balance)<60?'분':'시간 '+Math.max(0,b.balance)%60+'분')+'</small></div>'+
 '<div class="balance-bottom"><span>지금까지 모은 시간 <strong>'+textTime(b.earned)+'</strong></span><span>사용 · 차감 <strong>'+textTime(b.spent+b.penalties+b.reversals)+'</strong></span></div></div>';
}
function logList(n){
 var devices={};(state.devices||[]).forEach(function(d){devices[d.id]=d.label;});
 var logs=(state.ledger||[]).slice(0,n||50);
 if(!logs.length)return '<div class="empty">아직 적립 내역이 없어요.<br>오늘부터 차곡차곡 모아봐요.</div>';
 var kind={habit:"습관 보상",reversal:"승인 취소",bonus:"추가 보너스",penalty:"페널티",spend:"게임시간 사용"};
 return '<div class="logs">'+logs.map(function(x){return '<div class="log"><div><strong>'+esc(x.description)+'</strong><p>'+esc(x.day)+' · '+kind[x.kind]+(devices[x.actor_id]?' · '+esc(devices[x.actor_id]):'')+'</p></div><div class="'+(x.minutes>=0?"pos":"neg")+'">'+(x.minutes>0?"+":"")+x.minutes+'분</div></div>';}).join("")+'</div>';
}
function renderChild(){
 var checkById={};(state.checks||[]).forEach(function(x){checkById[x.habit_id]=x.status;});
 var active=state.habits.filter(function(x){return x.active;});
 var done=active.filter(function(x){return checkById[x.id]==="approved";}).length;
 var waiting=active.filter(function(x){return checkById[x.id]==="pending";}).length;
 shell('<main><div class="eyebrow">TODAY IS A GOOD DAY</div><h1 class="page-title">오늘도 하나씩 해보자!</h1><p class="sub">'+dayLabel(state.today)+' · 잘한 만큼 게임시간이 쌓여요.</p>'+
  '<div class="dashboard" style="margin-top:28px"><section>'+balanceCard()+'<div class="metric-row"><div class="metric"><span>오늘 승인 완료</span><strong>'+done+'<em> / '+active.length+'개</em></strong></div><div class="metric"><span>부모 확인 대기</span><strong>'+waiting+'<em>개</em></strong></div></div>'+
  '<div class="tips" style="margin-top:15px">오늘 한 일을 직접 눌러 알려줘. 엄마 또는 아빠가 확인하면 게임시간이 자동으로 더해져!</div></section>'+
  '<section><div class="section-head" style="margin-top:0"><h2>오늘의 약속</h2><span class="muted">완료 보상 최대 +'+active.reduce(function(n,h){return n+h.reward_minutes;},0)+'분</span></div>'+
  listHabits(false)+'<div class="section-head"><h2>최근에 모은 시간</h2></div><div class="box">'+logList(6)+'</div></section></div></main>',"child");
}
function renderParent(){
 var active=state.habits.filter(function(x){return x.active;});
 var count=(state.checks||[]).filter(function(c){return c.status==="approved";}).length;
 var waiting=(state.checks||[]).filter(function(c){return c.status==="pending";}).length;
 var tabs='<nav class="tabs" aria-label="관리 메뉴"><button class="tab '+(tab==="today"?"active":"")+'" data-action="tab" data-tab="today">오늘 관리</button><button class="tab '+(tab==="history"?"active":"")+'" data-action="tab" data-tab="history">보상 내역</button><button class="tab '+(tab==="settings"?"active":"")+'" data-action="tab" data-tab="settings">습관 관리</button></nav>';
 var body='';
 if(tab==="today"){
  body='<div class="dashboard" style="margin-top:25px"><section>'+balanceCard()+'<div class="metric-row"><div class="metric"><span>선택 날짜 승인</span><strong>'+count+'<em> / '+active.length+'개</em></strong></div><div class="metric"><span>확인 기다림</span><strong>'+waiting+'<em>개</em></strong></div></div>'+
    '<div class="section-head"><h2>게임시간 조정</h2></div><div class="box"><div class="toolbar"><button class="btn primary" data-action="adjust" data-kind="bonus">+ 보너스</button><button class="btn neutral" data-action="adjust" data-kind="penalty">− 페널티</button><button class="btn neutral" data-action="adjust" data-kind="spend">게임시간 사용</button></div><p class="infoline" style="margin-top:14px">보너스·페널티·게임시간 사용 내역은 이 브라우저에 저장됩니다.</p></div></section>'+
    '<section><div class="section-head" style="margin-top:0"><h2>습관 완료 확인</h2><span class="muted">완료 시 자동 적립</span></div>'+
    '<div class="datebar"><button data-action="dayprev" aria-label="전날">‹</button><div style="text-align:center"><strong>'+dayLabel(state.day)+'</strong><br><small>'+ (state.day===state.today?"오늘":"지난 날짜")+'</small></div><button data-action="daynext" aria-label="다음 날" '+(state.day>=state.today?"disabled":"")+'>›</button></div>'+
    '<div style="margin-top:13px">'+listHabits(true)+'</div><p class="infoline" style="margin-top:13px">아이가 “했어요”로 요청한 습관만 부모가 승인할 수 있습니다.</p></section></div>';
 }else if(tab==="history"){
  body='<section><div class="section-head"><h2>게임시간 보상 장부</h2><span class="muted">최근 내역</span></div><div class="box">'+logList(90)+'</div><div class="tips" style="margin-top:15px">보상 승인 취소 시 이전 기록을 삭제하지 않고 차감 기록을 추가하여 내역을 유지합니다.</div></section>';
 }else{
  body='<div class="dashboard" style="margin-top:22px"><section><div class="section-head" style="margin-top:0"><h2>습관과 보상</h2><button class="btn primary small" data-action="newhabit">+ 새 습관</button></div><div class="box">'+
   state.habits.map(function(h){return '<div class="settings-row '+(h.active?"":"faded")+'"><div><strong>'+esc(h.title)+'</strong><p>완료하면 +'+h.reward_minutes+'분 · '+(h.active?"사용 중":"중지됨")+'</p></div><div class="actions"><button class="btn neutral small" data-action="edithabit" data-id="'+esc(h.id)+'">수정</button><button class="btn '+(h.active?"warn":"secondary")+' small" data-action="togglehabit" data-id="'+esc(h.id)+'" data-active="'+(h.active?"false":"true")+'">'+(h.active?"중지":"재개")+'</button></div></div>';}).join("")+'</div></section>'+
   '<section><div class="section-head" style="margin-top:0"><h2>개인용 데이터</h2></div><div class="box">'+
   '<p class="sub" style="margin-top:0">한 번 등록하면 연결 코드 없이 사용할 수 있습니다. 상단 버튼으로 부모·아이 화면을 전환할 수 있습니다.</p>'+
   '<p class="infoline" style="margin-top:12px">습관과 보상 기록은 현재 브라우저에만 저장됩니다. 다른 기기와 실시간으로 공유되지 않습니다.</p>'+
   '<div class="toolbar" style="margin-top:18px"><button class="btn primary" data-action="export">기록 백업</button><button class="btn neutral" data-action="import">백업 복원</button></div>'+
   '<input id="restoreInput" type="file" accept=".json,application/json" style="display:none"></div></section></div>';
 }
 shell('<main><div class="eyebrow">FAMILY DASHBOARD</div><h1 class="page-title">오늘의 습관을 함께 관리해요.</h1><p class="sub">'+esc(state.device.label)+'님 · 개인용 모드 · 이 브라우저에 저장됩니다</p>'+tabs+body+'</main>',"parent");
}
function setupScreen(){
 app.innerHTML='<div class="shell">'+head(null)+
 '<main class="onboarding"><div class="welcome"><div class="eyebrow">PRIVATE FAMILY APP</div>'+
 '<h1>우리 아이 게임시간</h1><p class="sub">처음 사용하는 브라우저에서 한 번만 등록 비밀번호를 입력해 주세요.</p>'+
 '<form id="setupForm"><div class="fieldbox"><label class="field" for="setupPin">최초 등록 비밀번호</label>'+
 '<input class="input" id="setupPin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required placeholder="4자리 비밀번호"></div>'+
 '<button type="submit" class="btn primary wide">개인용으로 시작하기</button></form>'+
 '<p class="infoline" style="margin-top:15px">등록 후에는 별도 기기 연결 코드가 필요 없습니다. 기록은 이 브라우저에 저장됩니다.</p>'+
 '</div></main></div>';
}
function render(){
 if(localStorage.getItem(SETUP)!=="1"){setupScreen();return;}
 if(!state){app.innerHTML='<div class="shell"><p class="sub">기록을 불러오는 중입니다.</p></div>';return;}
 if(state.device.role==="child")renderChild();else renderParent();
}
async function load(silent){
 if(localStorage.getItem(SETUP)!=="1"){state=null;render();return;}
 try{
  var d=await api("state"+(date?"?day="+date:""));
  state=d;date=d.day;offline=false;render();
 }catch(e){
  if(!silent)toast(e.message||"기록을 불러오지 못했습니다.");
  if(!state)app.innerHTML='<div class="shell"><h1 class="page-title">기록을 열 수 없습니다.</h1><p class="sub">'+esc(e.message||"브라우저 저장 공간을 확인해 주세요.")+'</p></div>';
 }
}
function modalOpen(title,body){
 document.getElementById("modalInner").innerHTML='<div class="modal-top"><h2>'+title+'</h2><button class="x" data-action="close" aria-label="닫기">×</button></div>'+body;
 if(!modal.open)modal.showModal();
}
function showHabit(id){
 var found=state.habits.find(function(h){return h.id===id;});
 modalOpen(found?"습관 수정":"새 습관 등록",'<form id="habitForm"><input type="hidden" name="id" value="'+(found?esc(found.id):"")+'"><div class="fieldbox"><label class="field">습관 이름</label><input class="input" name="title" maxlength="80" required value="'+(found?esc(found.title):"")+'" placeholder="예: 스스로 방 정리하기"></div><div class="fieldbox"><label class="field">완료 시 게임시간 (분)</label><input class="input" type="number" name="minutes" min="1" max="180" required value="'+(found?found.reward_minutes:"5")+'"></div><p class="infoline">보상 시간을 수정해도 이미 적립된 과거 기록은 변경되지 않습니다.</p><div class="modal-actions"><button type="button" class="btn neutral" data-action="close">취소</button><button class="btn primary" type="submit">저장하기</button></div></form>');
}
function showAdjust(kind){
 var name={bonus:"보너스 지급",penalty:"페널티 적용",spend:"게임시간 사용"}[kind];
 modalOpen(name,'<form id="adjustForm"><input type="hidden" name="kind" value="'+kind+'"><div class="fieldbox"><label class="field">시간 (분)</label><input class="input" type="number" name="minutes" min="1" max="300" value="'+(kind==="bonus"?5:10)+'" required></div><div class="fieldbox"><label class="field">사유</label><input class="input" name="description" maxlength="100" required placeholder="'+(kind==="bonus"?"특별히 잘한 일":kind==="spend"?"게임시간 사용":"페널티 사유")+'"></div><p class="infoline">현재 남은 시간: '+textTime(state.summary.balance)+'</p><div class="modal-actions"><button type="button" class="btn neutral" data-action="close">취소</button><button class="btn primary" type="submit">적용하기</button></div></form>');
}
async function run(cb){
 if(busy)return;busy=true;
 try{await cb();}catch(e){toast(e.message||"처리 중 오류가 발생했습니다.");}
 finally{busy=false;}
}
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-action]");if(!el)return;
 var action=el.dataset.action;
 if(action==="switchrole"){
  localStorage.setItem(MODE,currentRole()==="parent"?"child":"parent");
  date=null;tab="today";load(false);
 }
 if(action==="reload"){load(false);}
 if(action==="close"){modal.close();}
 if(action==="tab"){tab=el.dataset.tab;render();}
 if(action==="dayprev"){date=dateShift(date,-1);load(false);}
 if(action==="daynext"&&date<state.today){date=dateShift(date,1);load(false);}
 if(action==="submit")run(async function(){await api("submit",{habitId:el.dataset.id});await load(true);toast("완료 요청을 부모 화면에 보냈어요!");});
 if(action==="review")run(async function(){await api("review",{habitId:el.dataset.id,day:state.day,status:el.dataset.status});await load(true);toast(el.dataset.status==="approved"?"보상 시간이 적립됐어요.":"확인 결과를 반영했어요.");});
 if(action==="adjust")showAdjust(el.dataset.kind);
 if(action==="newhabit")showHabit(null);
 if(action==="edithabit")showHabit(el.dataset.id);
 if(action==="togglehabit")run(async function(){
  if(!confirm(el.dataset.active==="false"?"이 습관을 중지할까요?":"이 습관을 다시 시작할까요?"))return;
  await api("habit",{id:el.dataset.id,active:el.dataset.active==="true"},"PATCH");
  await load(true);toast("습관 상태가 변경됐어요.");
 });
 if(action==="export"){
  try{
   var blob=new Blob([JSON.stringify(readData(),null,2)],{type:"application/json"});
   var url=URL.createObjectURL(blob),a=document.createElement("a");
   a.href=url;a.download="우리아이게임시간-"+todaySeoul()+".json";
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(function(){URL.revokeObjectURL(url);},5000);
   toast("백업 파일을 저장했어요.");
  }catch(ex){toast(ex.message||"백업에 실패했습니다.");}
 }
 if(action==="import"){var input=document.getElementById("restoreInput");if(input)input.click();}
});
document.addEventListener("submit",function(e){
 var f=e.target;if(!["setupForm","habitForm","adjustForm"].includes(f.id))return;
 e.preventDefault();
 var fd=new FormData(f);
 if(f.id==="setupForm"){
  var pin=String(fd.get("pin")||"");
  if(pin!=="5555"){toast("등록 비밀번호를 확인해주세요.");var field=f.querySelector("input[name=pin]");if(field){field.value="";field.focus();}return;}
  try{
   localStorage.setItem(SETUP,"1");localStorage.setItem(MODE,"parent");
   date=null;tab="today";state=null;load(false);toast("개인용 등록을 완료했습니다.");
  }catch(err){toast("저장소에 접근할 수 없습니다. 브라우저 설정을 확인해주세요.");}
 }
 if(f.id==="habitForm")run(async function(){
  var key=String(fd.get("id")||"");
  var data={title:String(fd.get("title")||"").trim(),minutes:Number(fd.get("minutes"))};
  if(key)data.id=key;
  await api("habit",data,key?"PATCH":"POST");modal.close();await load(true);toast("습관을 저장했어요.");
 });
 if(f.id==="adjustForm")run(async function(){
  await api("adjust",{kind:fd.get("kind"),minutes:Number(fd.get("minutes")),description:String(fd.get("description")||"").trim()});
  modal.close();await load(true);toast("게임시간 장부에 반영했어요.");
 });
});
modal.addEventListener("click",function(e){if(e.target===modal)modal.close();});
document.addEventListener("change",function(e){
 if(e.target.id!=="restoreInput"||!e.target.files||!e.target.files[0])return;
 var file=e.target.files[0];
 if(file.size>8000000){toast("백업 파일 크기를 확인해 주세요.");return;}
 run(async function(){
  var raw=await file.text(),d;
  try{d=JSON.parse(raw);}catch(err){throw new Error("JSON 백업 파일을 확인해주세요.");}
  if(!validData(d))throw new Error("지원하는 개인용 백업 파일이 아닙니다.");
  if(!confirm("현재 브라우저의 습관·보상 기록을 백업 내용으로 교체할까요?"))return;
  writeData(d);date=null;await load(true);toast("기록 복원이 완료됐습니다.");
 });
 e.target.value="";
});
window.addEventListener("storage",function(e){
 if(e.key===STORE||e.key===MODE||e.key===SETUP){date=null;load(true);}
});
document.addEventListener("visibilitychange",function(){
 if(document.visibilityState==="visible"&&!busy)load(true);
});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/kid-habits/sw.js",{scope:"/kid-habits/"}).catch(function(){});
load(true);
})();
</script>
</body></html>
