const N=192,Z=48;
function value(x,y,z){let k=1-Math.pow((z-23.5)/32,2),a=(x-76)*(x-76)/(63*63*k)+(y-100)*(y-100)/(49*49*k),b=(x-127)*(x-127)/(43*43*k)+(y-88)*(y-88)/(38*38*k);if(a>1&&b>1)return 0;let noise=Math.sin(x*.77+y*1.21+z*.49)*.17+Math.sin(x*.19-y*.53+z*.3)*.23;let lesion=5.8*Math.exp(-((x-82)**2+(y-100)**2)/240)+3.6*Math.exp(-((x-126)**2+(y-80)**2)/190);return Math.max(0,2.5+lesion+noise+0.7*Math.sin(z*.16+x*.04))}
function color(v){if(v<=0)return[9,22,32];let t=Math.max(0,Math.min(1,(v/12-.5)*(contrast/50)+.5+(brightness-50)/100));if(cmap==='gray'){let q=Math.round(t*255);return[q,q,q]}let stops=cmap==='hot'?[[10,4,17],[135,20,35],[255,122,20],[255,246,170]]:[[36,45,112],[35,108,166],[34,183,161],[255,229,111],[228,80,54]];let p=t*(stops.length-1),i=Math.min(stops.length-2,Math.floor(p)),f=p-i;return stops[i].map((n,j)=>Math.round(n+(stops[i+1][j]-n)*f))}
function viewer(){return head('철 정량 결과','합성 철 정량 맵 · 원형 ROI 및 데이터 다운로드', '<select onchange="selected=this.value;render()">'+jobs.filter(j=>j.status==='완료').map(j=>'<option '+(j.id===selected?'selected':'')+'>'+j.id+'</option>').join('')+'</select>')+'<div class="viewer"><div class="viewcard"><div class="toolbar"><span class="view-label">AXIAL · 축상면</span><button id="roibtn" class="btn '+(mode==='roi'?'selected':'')+'" onclick="toggleROI()">⊕ 원형 ROI</button><button class="btn" onclick="zoom=Math.min(2,zoom+.25);draw()">＋ 확대</button><button class="btn" onclick="zoom=Math.max(1,zoom-.25);draw()">－ 축소</button><button class="btn" onclick="resetView()">초기화</button><div class="download-group">'+btn('NIfTI','downloadNii()','small')+btn('PNG','downloadPNG()','small')+btn('CSV','downloadCSV()','small')+'</div></div><div class="canvasbox"><canvas id="map" width="384" height="384"></canvas><div class="overlaytop">SYNTHETIC Fe MAP<br>'+selected+' · Axial<br>R ⟷ L</div><div class="scale"></div></div><div class="slice"><div class="range"><span>슬라이스</span><b id="slicevalue">'+(slice+1)+' / 48</b></div><input aria-label="슬라이스" type="range" min="0" max="47" value="'+slice+'" oninput="slice=+this.value;draw()"></div></div><div class="stack"><div class="card"><h2>ROI 측정 결과</h2><div class="roiresult"><span class="muted">ROI 01 · 평균값</span><strong id="mean">—</strong><span class="muted">mg/g (합성 예시 단위)</span></div><div class="info"><div>최솟값<b id="min">—</b></div><div>최댓값<b id="max">—</b></div><div>표준편차<b id="std">—</b></div><div>복셀 수<b id="count">—</b></div></div><label class="field"><span class="label">ROI 반경 <span id="rad">'+roi.r+'</span> px</span><input type="range" min="4" max="40" value="'+roi.r+'" oninput="roi.r=+this.value;draw()"></label><small class="muted">영상 위 클릭 또는 드래그하여 ROI를 이동합니다.</small></div><div class="card"><h2>영상 표시 설정</h2><label class="field"><span class="label">컬러맵</span><select onchange="cmap=this.value;draw()"><option value="iron" '+(cmap==='iron'?'selected':'')+'>Iron · 정량 맵</option><option value="gray" '+(cmap==='gray'?'selected':'')+'>Grayscale</option><option value="hot" '+(cmap==='hot'?'selected':'')+'>Hot</option></select></label><label class="field"><span class="label">밝기</span><input type="range" min="0" max="100" value="'+brightness+'" oninput="brightness=+this.value;draw()"></label><label class="field"><span class="label">대비</span><input type="range" min="1" max="100" value="'+contrast+'" oninput="contrast=+this.value;draw()"></label></div><div class="download-note">상단 도구 모음에서 합성 NIfTI·PNG·CSV를 저장할 수 있습니다.</div></div></div>'}
function stats(){let arr=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if((x-roi.x)**2+(y-roi.y)**2<=roi.r**2)arr.push(value(x,y,slice));let m=arr.reduce((a,b)=>a+b,0)/arr.length;return{mean:m,min:Math.min(...arr),max:Math.max(...arr),std:Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length),count:arr.length}}
function draw(){let c=$('map');if(!c)return;let scale=document.querySelector('.scale');if(scale)scale.style.background=cmap==='gray'?'linear-gradient(to top,#000,#fff)':cmap==='hot'?'linear-gradient(to top,#0a0411,#871423,#ff7a14,#fff6aa)':'linear-gradient(to top,#242d70,#236ca6,#22b7a1,#ffe56f,#e45036)';let ctx=c.getContext('2d'),img=ctx.createImageData(384,384);for(let y=0;y<384;y++)for(let x=0;x<384;x++){let sx=(x/2-N/2)/zoom+N/2,sy=(y/2-N/2)/zoom+N/2,v=value(sx,sy,slice),co=color(v),i=(y*384+x)*4;img.data.set([co[0],co[1],co[2],255],i)}ctx.putImageData(img,0,0);let xx=(roi.x-N/2)*2*zoom+192,yy=(roi.y-N/2)*2*zoom+192;ctx.strokeStyle='#f5f7a3';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(xx,yy,roi.r*2*zoom,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(xx-4,yy);ctx.lineTo(xx+4,yy);ctx.moveTo(xx,yy-4);ctx.lineTo(xx,yy+4);ctx.stroke();ctx.font='12px sans-serif';ctx.fillStyle='#f5f7a3';ctx.fillText('ROI 01',xx+roi.r*2*zoom+6,yy);let s=stats();['mean','min','max','std'].forEach(k=>$(k).textContent=s[k].toFixed(3));$('count').textContent=s.count;$('rad').textContent=roi.r;$('slicevalue').textContent=(slice+1)+' / 48'}
function bindCanvas(){let c=$('map');let dragging=false;function move(e){if(mode!=='roi')return;let b=c.getBoundingClientRect();roi.x=Math.max(0,Math.min(N-1,Math.round(((e.clientX-b.left)/b.width*N-N/2)/zoom+N/2)));roi.y=Math.max(0,Math.min(N-1,Math.round(((e.clientY-b.top)/b.height*N-N/2)/zoom+N/2)));draw()}c.onpointerdown=e=>{dragging=true;c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=e=>{if(dragging)move(e)};c.onpointerup=c.onpointercancel=()=>dragging=false;draw()}

function downloadNii(){let buffer=new ArrayBuffer(352+N*N*Z*4),d=new DataView(buffer);d.setInt32(0,348,true);[3,N,N,Z,1,1,1,1].forEach((v,i)=>d.setInt16(40+i*2,v,true));d.setInt16(70,16,true);d.setInt16(72,32,true);[1,1,1,1,1,1,1,1].forEach((v,i)=>d.setFloat32(76+i*4,v,true));d.setFloat32(108,352,true);d.setFloat32(112,1,true);d.setUint8(123,2);d.setInt16(254,1,true);[280,300,320].forEach(p=>d.setFloat32(p,1,true));[110,43,49,0].forEach((v,i)=>d.setUint8(344+i,v));let f=new Float32Array(buffer,352),i=0;for(let z=0;z<Z;z++)for(let y=0;y<N;y++)for(let x=0;x<N;x++)f[i++]=value(x,y,z);save(new Blob([buffer],{type:'application/octet-stream'}),selected+'-synthetic.nii')}
let phantomRows=[[1,1.01],[2,1.98],[3,3.02],[4,4.04],[5,4.96]];const errorPct=r=>Math.abs(r[1]-r[0])/r[0]*100,passes=r=>errorPct(r)<=5,passCount=()=>phantomRows.filter(passes).length;
function phantom(){return head('팬텀 자동 검증','기준값 대비 측정값 오차 및 합격 여부를 확인합니다.',btn('▶ 검증 실행','runValidation()','primary'))+'<div class="grid metrics">'+[['검증 상태',validation?(passCount()===phantomRows.length?'PASS':'FAIL'):'대기'],['검증 영역','5'],['합격',validation?String(passCount()):'—'],['허용 오차','±5%']].map(a=>'<div class="card metric"><small>'+a[0]+'</small><strong>'+a[1]+'</strong><span>시연용 기준</span></div>').join('')+'</div><div class="card"><h2>표준 팬텀 · Demo-QA-01</h2><p class="muted">다음 기준과 측정값은 예시이며 실제 발주처 기준값이 아닙니다.</p><div class="tablewrap"><table><thead><tr><th>ROI</th><th>기준값</th><th>측정값</th><th>상대 오차</th><th>판정</th></tr></thead><tbody>'+phantomRows.map((r,i)=>'<tr><td>ROI 0'+(i+1)+'</td><td>'+r[0].toFixed(2)+'</td><td>'+(validation?r[1].toFixed(2):'—')+'</td><td>'+(validation?(Math.abs(r[1]-r[0])/r[0]*100).toFixed(2)+'%':'—')+'</td><td>'+(validation?(passes(r)?'<span class="pill ok">PASS</span>':'<span class="pill fail">FAIL</span>'):'대기')+'</td></tr>').join('')+'</tbody></table></div><p>'+btn('검증 결과 CSV','exportPhantom()','small')+'</p></div>'}
function runValidation(){validation=true;record('INFO','팬텀 모의 검증 완료: '+passCount()+'/'+phantomRows.length+' PASS');render();notify('모의 팬텀 검증 완료')}
function exportPhantom(){if(!validation)return notify('검증을 먼저 실행하세요.');save(new Blob(['roi,reference,measured,error_pct,pass\n'+phantomRows.map((r,i)=>[i+1,r[0],r[1],(Math.abs(r[1]-r[0])/r[0]*100).toFixed(2),passes(r)?'PASS':'FAIL'].join(',')).join('\n')],{type:'text/csv'}),'synthetic-phantom.csv')}
function userpage(){return head('사용자 관리','관리자 로그인과 사용자 접근 이력 화면 예시')+'<div class="card"><h2>사용자 목록 (모의)</h2><table><thead><tr><th>계정</th><th>권한</th><th>상태</th></tr></thead><tbody>'+users.map(u=>'<tr><td>'+esc(u.id)+'</td><td>'+u.role+'</td><td><span class="pill ok">'+u.state+'</span></td></tr>').join('')+'</tbody></table><p class="muted">이 데모에는 실제 인증이나 계정 저장 기능이 없습니다.</p>'+btn('로그인 화면 시연','showLogin()')+'</div>'}
function showLogin(){$('page').innerHTML=head('관리자 로그인','실제 인증을 수행하지 않는 화면 예시')+'<div class="card" style="max-width:400px;margin:45px auto"><h2>IRON Q 관리자</h2><label class="field">계정<input readonly value="demo-admin"></label><label class="field">비밀번호<input readonly type="password" value="demo-only"></label>'+btn('모의 로그인','demoLogin()','primary')+'</div>'+foot}
function demoLogin(){record('INFO','관리자 모의 로그인');go('dashboard')}
function logpage(){let x=paginate(logs,logPage);logPage=x.p;return head('시스템 로그','작업 및 사용자 활동 기록',btn('CSV 다운로드','exportLogs()'))+'<div class="card"><div class="tablewrap"><table><thead><tr><th>시간</th><th>레벨</th><th>이벤트</th></tr></thead><tbody>'+x.rows.map(l=>'<tr><td>'+l.time+'</td><td><span class="pill '+(l.level==='ERROR'?'fail':'wait')+'">'+l.level+'</span></td><td>'+esc(l.text)+'</td></tr>').join('')+'</tbody></table></div>'+pager(x,'logs')+'</div>'}
function exportLogs(){save(new Blob(['\uFEFFtime,level,event\n'+logs.map(l=>l.time+','+l.level+','+JSON.stringify(l.text)).join('\n')],{type:'text/csv;charset=utf-8'}),'demo-logs.csv')}
function settings(){return head('환경 설정','분석 EXE 교체 및 Windows 오프라인 설치 구성 예시')+'<div class="grid two"><div class="card"><h2>분석 엔진 어댑터</h2><label class="field">EXE 경로<input id="exe" value="'+esc(setting.exe)+'"></label><label class="field">데이터 저장 경로<input id="data" value="'+esc(setting.data)+'"></label><label class="field">실행 제한 시간 (초)<input id="timeout" type="number" min="1" value="'+setting.timeout+'"></label>'+btn('모의 설정 저장','saveSettings()','primary')+'</div><div class="card"><h2>설치 및 운영 점검 (예시)</h2>'+['Windows 오프라인 설치 패키지','내부 HTTPS 인증서','영속 작업 큐 및 재기동 복구','EXE 종료 코드 / error.json','서버 저장소 및 접근 통제'].map(x=>'<div class="check"><span class="pill wait">구현 예정</span> '+x+'</div>').join('')+'<p class="muted">공개 데모는 서버 및 의료 데이터를 사용하지 않습니다.</p></div></div>'}
function saveSettings(){setting={exe:$('exe').value,data:$('data').value,timeout:Math.max(1,+$('timeout').value||60)};record('INFO','모의 환경 설정 저장');notify('모의 설정을 메모리에 저장했습니다.')}
function render(){$('page').dataset.route=route;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));$('mobile').value=route;$('crumb').textContent=menus.find(m=>m[0]===route)[2];$('page').innerHTML=({dashboard,upload,jobs:jobpage,viewer,phantom,users:userpage,logs:logpage,settings}[route])()+foot;if(route==='viewer')bindCanvas()}
if(menus.some(m=>m[0]===location.hash.slice(1)))route=location.hash.slice(1);render();
</script></body></html>
